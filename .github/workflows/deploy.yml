name: Build and Deploy Pygbag Game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pygbag

      - name: Build WebAssembly package
        run: |
          # 使用 timeout 限制 15 秒，打包完成後自動結束常駐 server
          timeout 15s python3 -m pygbag --build --template noctx.tmpl . || true
          
          # 檢查並確保產出目錄存在
          if [ -d "build/web" ]; then
            echo "打包成功！檔案清單："
            ls -la build/web
          else
            echo "找不到 build/web 目錄"
            exit 1
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
