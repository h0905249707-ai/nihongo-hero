name: Build and Deploy Pygbag Game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pygbag

      - name: Build WebAssembly package
        run: |
          # 執行純打包模式 (不啟動本機伺服器)
          python3 -m pygbag --build --archive --ume_block 0 --template noctx.tmpl .
          
          # 確保產出目錄並防 Jekyll 過濾
          cd build/web
          if [ ! -f "index.html" ]; then
            cp *.html index.html || true
          fi
          touch .nojekyll
          
          echo "最終打包檔案清單："
          ls -la

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
