name: Build and Deploy Pygbag Game to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pygbag

      - name: Build WebAssembly package
        run: |
          # 限制 15 秒完成編譯
          timeout 15s python3 -m pygbag --build --template noctx.tmpl . || true
          
          # 進入產出目錄修正首頁檔名
          cd build/web
          
          # 確保有 index.html (若產出為其他名稱則自動建立 index.html)
          if [ ! -f "index.html" ]; then
            cp *.html index.html || true
          fi
          
          # 建立 .nojekyll 防止 GitHub 忽略底層 WASM 靜態資源
          touch .nojekyll
          
          echo "修正後目錄檔案清單："
          ls -la

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
