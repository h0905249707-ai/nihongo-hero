class Player {
    constructor() {
        this.name = "勇者";
        this.job = "戰士";
        this.level = 1; this.exp = 0; this.gold = 500;
        this.hp = 160; this.max_hp = 160;
        this.shield = 60; this.max_shield = 60;
        this.attack = 18; this.speed = 4.5;
        this.weapons = ["破舊短劍"];
        this.equipped_weapon = "破舊短劍";
        this.current_floor = 1;
        this.x = SCREEN_WIDTH / 2;
        this.y = SCREEN_HEIGHT / 2;
        this.applyJobStats();
    }
    applyJobStats() {
        if (this.job === "戰士") { this.max_hp = 160; this.max_shield = 60; this.attack = 18; this.speed = 4.5; }
        else if (this.job === "法師") { this.max_hp = 90; this.max_shield = 40; this.attack = 28; this.speed = 3.8; }
        else if (this.job === "弓箭手") { this.max_hp = 110; this.max_shield = 50; this.attack = 20; this.speed = 5.2; }
        this.hp = this.max_hp; this.shield = this.max_shield;
    }
    getTotalAttack() {
        const w = WEAPONS_DB.find(item => item.name === this.equipped_weapon) || {atk: 5};
        return this.attack + w.atk;
    }
    addExp(amount) {
        this.exp += amount;
        const needed = this.level * 50;
        if (this.exp >= needed) {
            this.exp -= needed; this.level += 1;
            this.max_hp += 20; this.hp = this.max_hp;
            this.shield = this.max_shield; this.attack += 4;
            return true;
        }
        return false;
    }
}

class Pet {
    constructor(name, x=300, y=300) {
        this.name = name; this.exp = 0; this.stage = 1;
        this.x = x; this.y = y;
        this.target_x = x; this.target_y = y;
        this.speed = 2.0; this.attackCooldown = 0;
        const info = PETS_DB.find(p => p.name === name) || PETS_DB[0];
        this.baseAtk = info.atk; this.reqExp = info.req_exp;
    }
    getCurrentAttack() { return this.baseAtk + (this.stage - 1) * 8; }
    follow(tx, ty) {
        const dist = Math.hypot(tx - this.x, ty - this.y);
        if (dist > 45) {
            const angle = Math.atan2(ty - this.y, tx - this.x);
            this.x += Math.cos(angle) * (this.speed * 1.5);
            this.y += Math.sin(angle) * (this.speed * 1.5);
        }
    }
    feed(addedExp) {
        this.exp += addedExp;
        if (this.exp >= this.reqExp && this.stage < 3) {
            this.exp -= this.reqExp;
            this.stage += 1;
            this.reqExp = Math.floor(this.reqExp * 1.5);
            return true;
        }
        return false;
    }
    getStageStr() { return {1: "幼年體", 2: "成長體", 3: "完全體"}[this.stage]; }
}

const btnAction = { x: SCREEN_WIDTH - 110, y: SCREEN_HEIGHT - 110, radius: 45, text: "互動", justPressed: false, touchId: null };
const btnSecondary = { x: SCREEN_WIDTH - 110, y: SCREEN_HEIGHT - 210, radius: 38, text: "切換", justPressed: false, touchId: null };

// ==========================================
// 4. 事件與多點觸控引擎 (自適應縮放)
// ==========================================
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function handleTouch(e) {
    e.preventDefault();
    btnAction.justPressed = false;
    btnSecondary.justPressed = false;

    for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        const pos = getCanvasPos(touch);

        // 搖桿區域
        const dJoy = Math.hypot(pos.x - joystick.x, pos.y - joystick.y);
        if (dJoy < joystick.radius * 1.8 && (joystick.touchId === null || joystick.touchId === touch.identifier)) {
            joystick.touchId = touch.identifier;
            const angle = Math.atan2(pos.y - joystick.y, pos.x - joystick.x);
            const dist = Math.min(dJoy, joystick.radius);
            joystick.stickX = joystick.x + Math.cos(angle) * dist;
            joystick.stickY = joystick.y + Math.sin(angle) * dist;
            joystick.dirX = Math.cos(angle) * (dist / joystick.radius);
            joystick.dirY = Math.sin(angle) * (dist / joystick.radius);
            continue;
        }

        // 互動鈕
        const dAct = Math.hypot(pos.x - btnAction.x, pos.y - btnAction.y);
        if (dAct < btnAction.radius && btnAction.touchId === null) {
            btnAction.touchId = touch.identifier;
            btnAction.justPressed = true;
            continue;
        }

        // 次要鈕
        const dSec = Math.hypot(pos.x - btnSecondary.x, pos.y - btnSecondary.y);
        if (dSec < btnSecondary.radius && btnSecondary.touchId === null) {
            btnSecondary.touchId = touch.identifier;
            btnSecondary.justPressed = true;
            continue;
        }
    }
}

canvas.addEventListener("touchstart", (e) => {
    handleTouch(e);
    for (let i = 0; i < e.changedTouches.length; i++) {
        handleClickAction(getCanvasPos(e.changedTouches[i]));
    }
}, {passive: false});

canvas.addEventListener("touchmove", handleTouch, {passive: false});

canvas.addEventListener("touchend", (e) => {
    e.preventDefault();
    const currentIds = Array.from(e.touches).map(t => t.identifier);
    if (!currentIds.includes(joystick.touchId)) {
        joystick.touchId = null; joystick.stickX = joystick.x; joystick.stickY = joystick.y;
        joystick.dirX = 0; joystick.dirY = 0;
    }
    if (!currentIds.includes(btnAction.touchId)) btnAction.touchId = null;
    if (!currentIds.includes(btnSecondary.touchId)) btnSecondary.touchId = null;
}, {passive: false});

canvas.addEventListener("mousedown", (e) => {
    const pos = getCanvasPos(e);
    handleClickAction(pos);
});

function handleClickAction(pos) {
    // 全域返回鈕
    if (state !== "LOBBY" && state !== "QUIZ") {
        if (pos.x >= btnBack.x && pos.x <= btnBack.x + btnBack.w && pos.y >= btnBack.y && pos.y <= btnBack.y + btnBack.h) {
            state = "LOBBY";
            return;
        }
    }

    if (state === "DUNGEON") {
        // 迷宮射擊 (過濾虛擬按鍵區)
        const dJoy = Math.hypot(pos.x - joystick.x, pos.y - joystick.y);
        const dAct = Math.hypot(pos.x - btnAction.x, pos.y - btnAction.y);
        if (dJoy > joystick.radius && dAct > btnAction.radius && pos.y > 80) {
            const camX = Math.max(0, Math.min(player.x - SCREEN_WIDTH / 2, WORLD_WIDTH - SCREEN_WIDTH));
            const camY = Math.max(0, Math.min(player.y - SCREEN_HEIGHT / 2, WORLD_HEIGHT - SCREEN_HEIGHT));
            shootBullet(pos.x + camX, pos.y + camY);
        }
    } else if (state === "LEARN_STAGE") {
        // 點擊卡片收藏或出發
        if (pos.x >= 680 && pos.x <= 840 && pos.y >= 15 && pos.y <= 55) {
            initDungeon();
            return;
        }
        stageWords.forEach((w, i) => {
            const col = i % 4, row = Math.floor(i / 4);
            const x = 30 + col * 240, y = 75 + row * 120;
            if (pos.x >= x && pos.x <= x + 220 && pos.y >= y && pos.y <= y + 105) {
                if (favoriteIds.includes(w.id)) favoriteIds = favoriteIds.filter(id => id !== w.id);
                else favoriteIds.push(w.id);
            }
        });
    } else if (state === "QUIZ") {
        quizOptions.forEach((opt, i) => {
            const bx = 250 + (i % 2) * 270, by = 320 + Math.floor(i / 2) * 90;
            if (pos.x >= bx && pos.x <= bx + 250 && pos.y >= by && pos.y <= by + 60) {
                if (opt === currentQuizChest.word.zh) {
                    const g = Math.floor(Math.random() * 50) + 30;
                    player.gold += g;
                    currentQuizChest.opened = true;
                    if (Math.random() < 0.45) {
                        healthPacks.push({x: currentQuizChest.x, y: currentQuizChest.y});
                        infoMsg = `✨ 答對了！獲得 💰 ${g} 金幣與 💖 回血包！`;
                    } else {
                        infoMsg = `✨ 答對了！獲得 💰 ${g} 金幣！`;
                    }
                } else {
                    infoMsg = `❌ 答錯了！正確答案是『${currentQuizChest.word.zh}』。`;
                }
                state = "DUNGEON";
            }
        });
    } else if (state === "SHOP") {
        FOODS_DB.forEach((f, i) => {
            const bx = 30 + (i % 5) * 190, by = 105 + Math.floor(i / 5) * 45;
            if (pos.x >= bx + 32 && pos.x <= bx + 177 && pos.y >= by && pos.y <= by + 38) {
                if (player.gold >= f.price) {
                    player.gold -= f.price;
                    inventoryFoods[f.name] = (inventoryFoods[f.name] || 0) + 1;
                    infoMsg = `🛒 購買了【${f.name}】！`;
                } else infoMsg = "❌ 金幣不足！";
            }
        });
        PETS_DB.forEach((p, i) => {
            const bx = 30 + (i % 5) * 190, by = 345 + Math.floor(i / 5) * 45;
            if (pos.x >= bx + 32 && pos.x <= bx + 177 && pos.y >= by && pos.y <= by + 38) {
                if (player.gold >= p.price) {
                    player.gold -= p.price;
                    pets.push(new Pet(p.name));
                    infoMsg = `🛒 成功購買強力寵物【${p.name}】！`;
                } else infoMsg = "❌ 金幣不足！";
            }
        });
    } else if (state === "BACKPACK") {
        player.weapons.forEach((wName, i) => {
            const bx = 30 + (i % 4) * 230, by = 120 + Math.floor(i / 4) * 60;
            if (pos.x >= bx + 32 && pos.x <= bx + 212 && pos.y >= by && pos.y <= by + 45) {
                player.equipped_weapon = wName;
                infoMsg = `⚔️ 已裝備【${wName}】！`;
            }
        });
    }
}

function shootBullet(tx, ty) {
    const angle = Math.atan2(ty - player.y, tx - player.x);
    bullets.push({
        x: player.x, y: player.y,
        vx: Math.cos(angle) * 11, vy: Math.sin(angle) * 11,
        damage: player.getTotalAttack(), color: COLOR_GOLD
    });
}

// ==========================================
// 5. 遊戲流程控制
// ==========================================
function prepareStage() {
    const unlearned = ALL_VOCABULARY.filter(w => !learnedIds.includes(w.id));
    if (unlearned.length < 20) stageWords = [...ALL_VOCABULARY].sort(() => 0.5 - Math.random()).slice(0, 20);
    else stageWords = [...unlearned].sort(() => 0.5 - Math.random()).slice(0, 20);
    stageWords.forEach(w => { if (!learnedIds.includes(w.id)) learnedIds.push(w.id); });
    state = "LEARN_STAGE";
}

function initDungeon() {
    stageChests = [];
    const shuffled = [...stageWords].sort(() => 0.5 - Math.random());
    let idx = 0;
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) {
            if (idx < 20) {
                stageChests.push({
                    x: 80 + c * ((WORLD_WIDTH - 160) / 4) + (Math.random() * 40 - 20),
                    y: 80 + r * ((WORLD_HEIGHT - 160) / 3) + (Math.random() * 40 - 20),
                    word: shuffled[idx], opened: false
                });
                idx++;
            }
        }
    }
    currentWave = 1;
    spawnWave(currentWave);
    currentBoss = null;
    bossSpawned = false;
    bossDefeated = false;
    player.x = WORLD_WIDTH / 2; player.y = WORLD_HEIGHT / 2;
    const pet = pets[activePetIdx];
    if (pet) { pet.x = player.x + 30; pet.y = player.y + 30; }
    bullets = []; groundWeapons = []; healthPacks = [];
    countdownTimer = 180;
    state = "DUNGEON";
}

function spawnWave(wNum) {
    stageMonsters = [];
    const count = 6 + player.current_floor * 2;
    for (let i = 0; i < count; i++) {
        const mIdx = Math.min(player.current_floor - 1 + Math.floor(Math.random() * 3), 19);
        const mInfo = MONSTER_TYPES[mIdx];
        const floorMult = 1.0 + (player.current_floor - 1) * 0.2;
        stageMonsters.push({
            x: Math.random() * (WORLD_WIDTH - 160) + 80,
            y: Math.random() * (WORLD_HEIGHT - 160) + 80,
            typeIdx: mIdx,
            name: mInfo.name,
            hp: Math.floor(mInfo.hp * floorMult),
            max_hp: Math.floor(mInfo.hp * floorMult),
            attack: Math.floor(mInfo.atk * floorMult),
            speed: mInfo.speed,
            color: mInfo.color
        });
    }
    infoMsg = `⚔️ 第 ${wNum} / ${maxWaves} 波怪物來襲！`;
}

// ==========================================
// 6. 主更新循環
// ==========================================
function update() {
    // 玩家位移
    player.x += joystick.dirX * player.speed;
    player.y += joystick.dirY * player.speed;
    const boundW = (state === "DUNGEON") ? WORLD_WIDTH : SCREEN_WIDTH;
    const boundH = (state === "DUNGEON") ? WORLD_HEIGHT : SCREEN_HEIGHT;
    player.x = Math.max(25, Math.min(boundW - 25, player.x));
    player.y = Math.max(25, Math.min(boundH - 25, player.y));

    const pet = pets[activePetIdx];
    if (pet) pet.follow(player.x, player.y);

    if (state === "LOBBY") {
        // 切換職業
        if (btnSecondary.justPressed) {
            btnSecondary.justPressed = false;
            const jobs = ["戰士", "法師", "弓箭手"];
            player.job = jobs[(jobs.indexOf(player.job) + 1) % 3];
            player.applyJobStats();
            infoMsg = `職業切換為【${player.job}】！`;
        }
        // 靠近設施互動
        if (btnAction.justPressed) {
            btnAction.justPressed = false;
            if (Math.hypot(player.x - (rectDoor.x + 50), player.y - (rectDoor.y + 40)) < 70) prepareStage();
            else if (Math.hypot(player.x - (rectShop.x + 60), player.y - (rectShop.y + 45)) < 75) state = "SHOP";
            else if (Math.hypot(player.x - (rectPetHouse.x + 60), player.y - (rectPetHouse.y + 50)) < 75) state = "PET_HOUSE";
            else if (Math.hypot(player.x - (rectVocab.x + 50), player.y - (rectVocab.y + 50)) < 70) state = "VOCAB_BANK";
            else if (Math.hypot(player.x - (rectChest.x + 50), player.y - (rectChest.y + 50)) < 70) state = "BACKPACK";
        }
    } else if (state === "PET_HOUSE") {
        pets.forEach((p, idx) => {
            if (Math.hypot(player.x - p.x, player.y - p.y) < 50) {
                if (btnSecondary.justPressed) {
                    btnSecondary.justPressed = false;
                    activePetIdx = idx;
                    infoMsg = `🐾 【${p.name}】已設為出戰寵物！`;
                } else if (btnAction.justPressed) {
                    btnAction.justPressed = false;
                    const avail = Object.keys(inventoryFoods).find(k => inventoryFoods[k] > 0);
                    if (avail) {
                        inventoryFoods[avail]--;
                        const fInfo = FOODS_DB.find(f => f.name === avail);
                        if (p.feed(fInfo.exp)) infoMsg = `🎉 寵物【${p.name}】進化為【${p.getStageStr()}】！`;
                        else infoMsg = `🍖 餵食了【${avail}】(+${fInfo.exp} EXP)！`;
                    } else infoMsg = "❌ 庫存沒有食物，請去商店購買！";
                }
            }
        });
    } else if (state === "DUNGEON") {
        if (countdownTimer > 0) { countdownTimer--; return; }

        // 寵物自動索敵
        if (pet) {
            pet.attackCooldown++;
            if (pet.attackCooldown >= 45) {
                let tgt = null, minD = 350;
                const allT = [...stageMonsters, ...(currentBoss ? [currentBoss] : [])];
                allT.forEach(e => {
                    const d = Math.hypot(e.x - pet.x, e.y - pet.y);
                    if (d < minD) { minD = d; tgt = e; }
                });
                if (tgt) {
                    pet.attackCooldown = 0;
                    const angle = Math.atan2(tgt.y - pet.y, tgt.x - pet.x);
                    bullets.push({
                        x: pet.x, y: pet.y,
                        vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10,
                        damage: pet.getCurrentAttack(), color: COLOR_PURPLE
                    });
                }
            }
        }

        // 子彈碰撞
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (b.x < 0 || b.x > WORLD_WIDTH || b.y < 0 || b.y > WORLD_HEIGHT) { bullets.splice(i, 1); continue; }

            if (currentBoss && Math.hypot(b.x - currentBoss.x, b.y - currentBoss.y) < 40) {
                currentBoss.hp -= b.damage;
                bullets.splice(i, 1);
                if (currentBoss.hp <= 0) {
                    currentBoss = null; bossDefeated = true;
                    player.gold += 300; player.addExp(150);
                    infoMsg = "🏆 成功擊敗本層 BOSS！";
                }
                continue;
            }

            for (let j = stageMonsters.length - 1; j >= 0; j--) {
                const m = stageMonsters[j];
                if (Math.hypot(b.x - m.x, b.y - m.y) < 25) {
                    m.hp -= b.damage;
                    bullets.splice(i, 1);
                    if (m.hp <= 0) {
                        stageMonsters.splice(j, 1);
                        player.gold += Math.floor(Math.random() * 20) + 20;
                        player.addExp(25);
                        if (Math.random() < 0.25) {
                            const chosen = WEAPONS_DB[Math.floor(Math.random() * WEAPONS_DB.length)].name;
                            groundWeapons.push({x: m.x, y: m.y, name: chosen});
                        }
                    }
                    break;
                }
            }
        }

        // 撿武器與回血包
        for (let i = groundWeapons.length - 1; i >= 0; i--) {
            if (Math.hypot(player.x - groundWeapons[i].x, player.y - groundWeapons[i].y) < 30) {
                if (!player.weapons.includes(groundWeapons[i].name)) player.weapons.push(groundWeapons[i].name);
                infoMsg = `🎉 拾獲新神兵【${groundWeapons[i].name}】！`;
                groundWeapons.splice(i, 1);
            }
        }
        for (let i = healthPacks.length - 1; i >= 0; i--) {
            if (Math.hypot(player.x - healthPacks[i].x, player.y - healthPacks[i].y) < 30) {
                const heal = Math.floor(player.max_hp * 0.2);
                player.hp = Math.min(player.max_hp, player.hp + heal);
                infoMsg = `💖 拾取回血包！(+${heal} HP)！`;
                healthPacks.splice(i, 1);
            }
        }

        // 怪物與 BOSS 移動攻擊
        stageMonsters.forEach(m => {
            const angle = Math.atan2(player.y - m.y, player.x - m.x);
            m.x += Math.cos(angle) * m.speed; m.y += Math.sin(angle) * m.speed;
            if (Math.hypot(player.x - m.x, player.y - m.y) < 28) {
                if (player.shield > 0) player.shield -= 0.4; else player.hp -= 0.3;
            }
        });

        if (currentBoss) {
            const angle = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x);
            currentBoss.x += Math.cos(angle) * currentBoss.speed; currentBoss.y += Math.sin(angle) * currentBoss.speed;
            if (Math.hypot(player.x - currentBoss.x, player.y - currentBoss.y) < 45) {
                if (player.shield > 0) player.shield -= 0.6; else player.hp -= 0.5;
            }
        }

        // 波次推進
        if (stageMonsters.length === 0) {
            if (currentWave < maxWaves) {
                currentWave++; spawnWave(currentWave);
            } else if (!bossSpawned && !bossDefeated) {
                const bIdx = Math.min(player.current_floor * 2 - 1, 19);
                const bInfo = MONSTER_TYPES[bIdx];
                const floorMult = 1.0 + (player.current_floor - 1) * 0.2;
                currentBoss = {
                    x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, name: `👑 ${bInfo.name} BOSS`,
                    hp: Math.floor(bInfo.hp * 4 * floorMult), max_hp: Math.floor(bInfo.hp * 4 * floorMult),
                    speed: bInfo.speed, color: bInfo.color
                };
                bossSpawned = true;
                infoMsg = `⚠️ 警告！【${currentBoss.name}】降臨了！`;
            }
        }

        // 觸發寶箱問答
        stageChests.forEach(c => {
            if (!c.opened && Math.hypot(player.x - c.x, player.y - c.y) < 35) {
                currentQuizChest = c;
                const correct = c.word.zh;
                const wrongs = ALL_VOCABULARY.map(w => w.zh).filter(zh => zh !== correct);
                quizOptions = [...wrongs.sort(() => 0.5 - Math.random()).slice(0, 3), correct].sort(() => 0.5 - Math.random());
                state = "QUIZ";
            }
        });

        if (player.hp <= 0) {
            player.hp = player.max_hp; player.shield = player.max_shield;
            infoMsg = "💀 你在迷宮中戰敗！已返回大廳。";
            state = "LOBBY";
        }

        if (stageMonsters.length === 0 && bossDefeated && stageChests.every(c => c.opened)) {
            player.current_floor++;
            infoMsg = `🎉 晉級至第 ${player.current_floor} 層！`;
            state = "LOBBY";
        }
    }
}

// ==========================================
// 7. 渲染引擎
// ==========================================
function draw() {
    ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

    let camX = 0, camY = 0;
    if (state === "DUNGEON") {
        camX = Math.max(0, Math.min(player.x - SCREEN_WIDTH / 2, WORLD_WIDTH - SCREEN_WIDTH));
        camY = Math.max(0, Math.min(player.y - SCREEN_HEIGHT / 2, WORLD_HEIGHT - SCREEN_HEIGHT));
    }

    if (state === "LOBBY") {
        ctx.fillStyle = "#2d201c"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        // 地板隔線與地毯
        ctx.strokeStyle = "#231612"; ctx.lineWidth = 2;
        for (let x = 0; x < SCREEN_WIDTH; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SCREEN_HEIGHT); ctx.stroke(); }
        ctx.fillStyle = "#962828"; ctx.roundRect(220, 180, 584, 360, 12); ctx.fill();

        // 建築設施
        [rectDoor, rectShop, rectPetHouse, rectVocab, rectChest].forEach(b => {
            ctx.fillStyle = "#50555f"; ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill();
            ctx.strokeStyle = b.color; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#141419"; ctx.fillRect(b.x + b.w/2 - 45, b.y + b.h + 4, 90, 22);
            ctx.fillStyle = b.color; ctx.font = "bold 14px sans-serif";
            ctx.fillText(b.name, b.x + b.w/2 - 40, b.y + b.h + 20);
        });

        // 繪製玩家與寵物
        drawHero(player.x, player.y, player.job);
        const pet = pets[activePetIdx];
        if (pet) drawPet(pet.x, pet.y, pet.stage);

        // 頂部狀態與底部訊息
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif";
        ctx.fillText(`【${player.name}】Lv.${player.level} ${player.job} | 出戰: ${pet ? pet.name : '無'} | 💰 ${player.gold}`, 30, 40);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "16px sans-serif";
        ctx.fillText(infoMsg, 40, SCREEN_HEIGHT - 35);

    } else if (state === "DUNGEON") {
        // 地牢地磚
        for (let x = 0; x < SCREEN_WIDTH + 64; x += 64) {
            for (let y = 0; y < SCREEN_HEIGHT + 64; y += 64) {
                const gx = Math.floor((x + camX) / 64), gy = Math.floor((y + camY) / 64);
                ctx.fillStyle = (gx + gy) % 2 === 0 ? COLOR_DUNGEON_1 : COLOR_DUNGEON_2;
                ctx.fillRect(x - (camX % 64), y - (camY % 64), 64, 64);
            }
        }

        // 寶箱
        stageChests.forEach(c => {
            ctx.fillStyle = c.opened ? "#503214" : "#8b5a2b";
            ctx.roundRect(c.x - camX - 17, c.y - camY - 17, 34, 34, 4); ctx.fill();
            ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 1.5; ctx.stroke();
            if (!c.opened) {
                ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 14px sans-serif";
                ctx.fillText(c.word.jp, c.x - camX - 16, c.y - camY - 22);
            }
        });

        // 掉落物
        groundWeapons.forEach(gw => {
            ctx.strokeStyle = COLOR_GOLD; ctx.beginPath(); ctx.arc(gw.x - camX, gw.y - camY, 14, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = COLOR_GOLD; ctx.font = "12px sans-serif"; ctx.fillText(gw.name, gw.x - camX - 15, gw.y - camY - 18);
        });
        healthPacks.forEach(hp => {
            ctx.fillStyle = COLOR_WHITE; ctx.roundRect(hp.x - camX - 12, hp.y - camY - 12, 24, 24, 4); ctx.fill();
            ctx.fillStyle = COLOR_RED; ctx.fillRect(hp.x - camX - 3, hp.y - camY - 9, 6, 18); ctx.fillRect(hp.x - camX - 9, hp.y - camY - 3, 18, 6);
        });

        // 怪物與 BOSS
        stageMonsters.forEach(m => {
            ctx.fillStyle = m.color; ctx.roundRect(m.x - camX - 18, m.y - camY - 18, 36, 36, 6); ctx.fill();
            ctx.fillStyle = COLOR_GREEN; ctx.fillRect(m.x - camX - 18, m.y - camY - 26, (m.hp / m.max_hp) * 36, 5);
        });
        if (currentBoss) {
            ctx.fillStyle = currentBoss.color; ctx.roundRect(currentBoss.x - camX - 32, currentBoss.y - camY - 32, 64, 64, 8); ctx.fill();
            ctx.fillStyle = COLOR_GOLD; ctx.fillText("👑 BOSS", currentBoss.x - camX - 25, currentBoss.y - camY - 40);
        }

        // 子彈
        bullets.forEach(b => {
            ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, 5, 0, Math.PI*2); ctx.fill();
        });

        // 玩家與寵物
        drawHero(player.x - camX, player.y - camY, player.job);
        const pet = pets[activePetIdx];
        if (pet) drawPet(pet.x - camX, pet.y - camY, pet.stage);

        // 頂部 HUD
        ctx.fillStyle = "#0f1218"; ctx.fillRect(0, 0, SCREEN_WIDTH, 50);
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 16px sans-serif";
        ctx.fillText(`HP: ${Math.floor(player.hp)}/${player.max_hp} | 護盾: ${Math.floor(player.shield)} | 第 ${currentWave}/${maxWaves} 波 | 💰 ${player.gold}`, 20, 32);

        if (currentBoss) {
            ctx.fillStyle = "#280000"; ctx.roundRect(250, 60, 524, 20, 4); ctx.fill();
            ctx.fillStyle = COLOR_RED; ctx.roundRect(250, 60, 524 * (currentBoss.hp / currentBoss.max_hp), 20, 4); ctx.fill();
        }

        if (countdownTimer > 0) {
            ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 72px sans-serif";
            ctx.fillText(Math.ceil(countdownTimer / 60), SCREEN_WIDTH / 2 - 20, SCREEN_HEIGHT / 2);
        }

    } else if (state === "LEARN_STAGE") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 26px sans-serif";
        ctx.fillText(`📖 第 ${player.current_floor} 層 - 單字預習 (點擊卡片收藏 ★)`, 30, 45);

        ctx.fillStyle = COLOR_GREEN; ctx.roundRect(680, 15, 160, 40, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText("🚀 出發", 730, 42);

        stageWords.forEach((w, i) => {
            const col = i % 4, row = Math.floor(i / 4);
            const x = 30 + col * 240, y = 75 + row * 120;
            const isFav = favoriteIds.includes(w.id);
            ctx.fillStyle = isFav ? "#4b411e" : "#323c50"; ctx.roundRect(x, y, 220, 105, 6); ctx.fill();
            ctx.strokeStyle = isFav ? COLOR_GOLD : COLOR_GRAY; ctx.stroke();
            ctx.fillStyle = isFav ? COLOR_GOLD : COLOR_WHITE; ctx.font = "bold 18px sans-serif";
            ctx.fillText(`${isFav ? "★" : "☆"} ${w.jp}`, x + 12, y + 28);
            ctx.fillStyle = COLOR_GRAY; ctx.font = "14px sans-serif"; ctx.fillText(`(${w.romaji})`, x + 12, y + 55);
            ctx.fillStyle = COLOR_GREEN; ctx.font = "bold 16px sans-serif"; ctx.fillText(w.zh, x + 12, y + 85);
        });

    } else if (state === "QUIZ") {
        ctx.fillStyle = "rgba(10, 15, 20, 0.9)"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_PANEL; ctx.roundRect(200, 140, 624, 440, 12); ctx.fill();
        ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText("📦 寶箱解鎖問答", 430, 190);
        ctx.fillStyle = COLOR_WHITE; ctx.font = "22px sans-serif";
        ctx.fillText(`請問『 ${currentQuizChest.word.jp} 』(${currentQuizChest.word.romaji}) 的意思？`, 260, 260);

        quizOptions.forEach((opt, i) => {
            const bx = 250 + (i % 2) * 270, by = 320 + Math.floor(i / 2) * 90;
            ctx.fillStyle = COLOR_BLUE; ctx.roundRect(bx, by, 250, 60, 6); ctx.fill();
            ctx.strokeStyle = COLOR_WHITE; ctx.stroke();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 20px sans-serif";
            ctx.fillText(`${i + 1}. ${opt}`, bx + 30, by + 38);
        });

    } else if (state === "SHOP") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText(`🛒 補給商店 (💰 金幣: ${player.gold})`, 30, 45);

        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 16px sans-serif";
        ctx.fillText("🍎 購買食物 (賦予寵物經驗值):", 30, 90);
        FOODS_DB.forEach((f, i) => {
            const bx = 30 + (i % 5) * 190, by = 105 + Math.floor(i / 5) * 45;
            ctx.fillStyle = COLOR_GREEN; ctx.roundRect(bx + 32, by, 145, 38, 6); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "14px sans-serif"; ctx.fillText(`${f.name} 💰${f.price}`, bx + 45, by + 24);
        });

        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 16px sans-serif";
        ctx.fillText("🐾 購買寵物 (加強戰力):", 30, 330);
        PETS_DB.forEach((p, i) => {
            const bx = 30 + (i % 5) * 190, by = 345 + Math.floor(i / 5) * 45;
            ctx.fillStyle = COLOR_PURPLE; ctx.roundRect(bx + 32, by, 145, 38, 6); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "14px sans-serif"; ctx.fillText(`${p.name} 💰${p.price}`, bx + 45, by + 24);
        });

        ctx.fillStyle = COLOR_GOLD; ctx.font = "16px sans-serif"; ctx.fillText(infoMsg, 30, SCREEN_HEIGHT - 35);

    } else if (state === "BACKPACK") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText(`🧰 軍火背包 - 目前裝備: 【${player.equipped_weapon}】(攻+${player.getTotalAttack()})`, 30, 45);

        player.weapons.forEach((wName, i) => {
            const bx = 30 + (i % 4) * 230, by = 120 + Math.floor(i / 4) * 60;
            const isEq = (wName === player.equipped_weapon);
            const wInfo = WEAPONS_DB.find(w => w.name === wName) || {atk: 5};
            ctx.fillStyle = isEq ? COLOR_GOLD : COLOR_BLUE; ctx.roundRect(bx + 32, by, 180, 45, 6); ctx.fill();
            ctx.fillStyle = isEq ? COLOR_BG_DARK : COLOR_WHITE; ctx.font = "bold 16px sans-serif";
            ctx.fillText(`${wName} (+${wInfo.atk})`, bx + 45, by + 28);
        });

    } else if (state === "VOCAB_BANK") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText("⭐ 單字收藏庫", 30, 45);
        const favs = ALL_VOCABULARY.filter(w => favoriteIds.includes(w.id));
        if (favs.length === 0) {
            ctx.fillStyle = COLOR_WHITE; ctx.font = "18px sans-serif";
            ctx.fillText("尚無收藏單字！在預習介面點擊單字卡即可收藏。", 50, 120);
        } else {
            favs.forEach((w, i) => {
                ctx.fillStyle = COLOR_GOLD; ctx.font = "18px sans-serif";
                ctx.fillText(`★ [${w.jp}] (${w.romaji}) = ${w.zh}`, 50, 95 + i * 36);
            });
        }
    }

    // 全域返回按鈕
    if (state !== "LOBBY" && state !== "QUIZ") {
        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 16px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 18, btnBack.y + 26);
    }

    // 繪製虛擬搖桿與按鍵
    if (["LOBBY", "DUNGEON", "PET_HOUSE"].includes(state)) {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(joystick.x, joystick.y, joystick.radius, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.7)";
        ctx.beginPath(); ctx.arc(joystick.stickX, joystick.stickY, 25, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = COLOR_GOLD; ctx.beginPath(); ctx.arc(btnAction.x, btnAction.y, btnAction.radius, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = COLOR_BG_DARK; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnAction.text, btnAction.x - 18, btnAction.y + 6);

        if (state === "LOBBY" || state === "PET_HOUSE") {
            ctx.fillStyle = COLOR_PURPLE; ctx.beginPath(); ctx.arc(btnSecondary.x, btnSecondary.y, btnSecondary.radius, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 16px sans-serif"; ctx.fillText(btnSecondary.text, btnSecondary.x - 16, btnSecondary.y + 5);
        }
    }
}

function drawHero(x, y, job) {
    ctx.fillStyle = (job === "戰士") ? "#8c919b" : (job === "法師" ? COLOR_PURPLE : COLOR_GREEN);
    ctx.roundRect(x - 18, y - 18, 36, 36, 5); ctx.fill();
    ctx.strokeStyle = COLOR_WHITE; ctx.stroke();
}

function drawPet(x, y, stage) {
    const size = 16 + stage * 6;
    ctx.fillStyle = "#e19b3c"; ctx.beginPath(); ctx.arc(x, y, size, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLOR_WHITE; ctx.beginPath(); ctx.arc(x - size/3, y - size/4, 3, 0, Math.PI*2); ctx.arc(x + size/3, y - size/4, 3, 0, Math.PI*2); ctx.fill();
}

// ==========================================
// 8. 啟動進入點
// ==========================================
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
