function drawPixelHero(ctx, x, y, job) {
    ctx.save();
    ctx.translate(x - 18, y - 18);
    if (job === "戰士") {
        ctx.fillStyle = "rgb(140, 145, 155)"; ctx.roundRect(8, 12, 20, 18, 4); ctx.fill();
        ctx.fillStyle = "rgb(180, 185, 195)"; ctx.roundRect(6, 4, 24, 16, 5); ctx.fill();
        ctx.fillStyle = "rgb(20, 20, 25)"; ctx.fillRect(10, 10, 16, 4);
        ctx.fillStyle = COLOR_RED;
        ctx.beginPath(); ctx.moveTo(18, 4); ctx.lineTo(12, -2); ctx.lineTo(18, 0); ctx.closePath(); ctx.fill();
    } else if (job === "法師") {
        ctx.fillStyle = COLOR_PURPLE;
        ctx.beginPath(); ctx.moveTo(18, 6); ctx.lineTo(4, 32); ctx.lineTo(32, 32); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgb(110, 50, 160)";
        ctx.beginPath(); ctx.ellipse(18, 16, 16, 4, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgb(130, 60, 180)";
        ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(8, 14); ctx.lineTo(28, 14); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COLOR_GOLD; ctx.beginPath(); ctx.arc(18, 8, 3, 0, Math.PI*2); ctx.fill();
    } else {
        ctx.fillStyle = COLOR_GREEN;
        ctx.beginPath(); ctx.moveTo(18, 2); ctx.lineTo(4, 32); ctx.lineTo(32, 32); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgb(135, 85, 45)"; ctx.fillRect(10, 14, 16, 14);
        ctx.fillStyle = "rgb(30, 40, 30)"; ctx.fillRect(8, 10, 20, 4);
    }
    ctx.restore();
}

function drawPixelMonster(ctx, x, y, idx, isBoss=false) {
    ctx.save();
    const size = isBoss ? 64 : 36;
    const scale = size / 36.0;
    ctx.translate(x - size/2, y - size/2);

    if (idx === 0) {
        ctx.fillStyle = COLOR_GREEN;
        ctx.beginPath(); ctx.ellipse(18*scale, 20*scale, 14*scale, 12*scale, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgb(200, 255, 200)";
        ctx.beginPath(); ctx.ellipse(13*scale, 14*scale, 5*scale, 4*scale, 0, 0, Math.PI*2); ctx.fill();
    } else if (idx === 1) {
        ctx.fillStyle = "rgb(39, 174, 96)";
        ctx.roundRect(8*scale, 8*scale, 20*scale, 22*scale, 4*scale); ctx.fill();
        ctx.beginPath(); ctx.moveTo(8*scale, 12*scale); ctx.lineTo(0, 6*scale); ctx.lineTo(8*scale, 18*scale); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(28*scale, 12*scale); ctx.lineTo(36*scale, 6*scale); ctx.lineTo(28*scale, 18*scale); ctx.closePath(); ctx.fill();
    } else if (idx === 2) {
        ctx.fillStyle = "rgb(236, 240, 241)";
        ctx.roundRect(8*scale, 4*scale, 20*scale, 18*scale, 5*scale); ctx.fill();
        ctx.fillStyle = "rgb(20, 20, 20)";
        ctx.beginPath(); ctx.arc(13*scale, 12*scale, 3*scale, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(23*scale, 12*scale, 3*scale, 0, Math.PI*2); ctx.fill();
    } else {
        const cList = ["rgb(211,84,0)", "rgb(52,152,219)", "rgb(127,140,141)", "rgb(39,174,96)", "rgb(44,62,80)", "rgb(52,73,94)", "rgb(180,130,90)", "rgb(192,57,43)", "rgb(241,196,15)", "rgb(149,165,166)"];
        ctx.fillStyle = cList[idx % 10];
        ctx.roundRect(6*scale, 6*scale, 24*scale, 24*scale, 6*scale); ctx.fill();
        ctx.fillStyle = COLOR_RED;
        ctx.beginPath(); ctx.arc(12*scale, 14*scale, 3*scale, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(24*scale, 14*scale, 3*scale, 0, Math.PI*2); ctx.fill();
    }

    if (isBoss) {
        ctx.fillStyle = COLOR_GOLD;
        ctx.beginPath(); ctx.moveTo(16, 12); ctx.lineTo(24, 0); ctx.lineTo(32, 12); ctx.lineTo(40, 0); ctx.lineTo(48, 12); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COLOR_RED; ctx.beginPath(); ctx.arc(32, 6, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
}

function drawPixelFood(ctx, x, y, name) {
    ctx.save();
    ctx.translate(x, y);
    const idx = FOODS_DB.findIndex(f => f.name === name);
    if (idx === 0) { // 蘋果
        ctx.fillStyle = COLOR_RED; ctx.beginPath(); ctx.arc(14, 16, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgb(100, 50, 20)"; ctx.fillRect(13, 2, 3, 6);
    } else if (idx === 1) { // 香蕉
        ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(14, 14, 10, 0.2, 2.2); ctx.stroke();
    } else if (idx === 2) { // 草莓
        ctx.fillStyle = COLOR_RED; ctx.beginPath(); ctx.moveTo(8, 8); ctx.lineTo(20, 8); ctx.lineTo(14, 24); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COLOR_GREEN; ctx.beginPath(); ctx.moveTo(10, 8); ctx.lineTo(14, 4); ctx.lineTo(18, 8); ctx.closePath(); ctx.fill();
    } else if (idx === 4) { // 西瓜
        ctx.fillStyle = COLOR_GREEN; ctx.beginPath(); ctx.ellipse(14, 14, 11, 8, 0, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = "rgb(20, 80, 30)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(6, 8); ctx.lineTo(20, 18); ctx.stroke();
    } else if (idx === 8) { // 南瓜派
        ctx.fillStyle = "rgb(230, 126, 34)"; ctx.beginPath(); ctx.moveTo(6, 22); ctx.lineTo(22, 22); ctx.lineTo(14, 6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.beginPath(); ctx.arc(14, 14, 3, 0, Math.PI*2); ctx.fill();
    } else if (idx === 11) { // 飯糰
        ctx.fillStyle = COLOR_WHITE; ctx.beginPath(); ctx.moveTo(14, 4); ctx.lineTo(4, 22); ctx.lineTo(24, 22); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgb(20, 20, 20)"; ctx.fillRect(10, 16, 8, 6);
    } else if (idx === 19) { // 聖代
        ctx.fillStyle = "rgb(100, 200, 255)"; ctx.beginPath(); ctx.moveTo(8, 14); ctx.lineTo(20, 14); ctx.lineTo(14, 26); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.beginPath(); ctx.arc(14, 10, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = COLOR_RED; ctx.beginPath(); ctx.arc(14, 5, 3, 0, Math.PI*2); ctx.fill();
    } else {
        const cList = [COLOR_RED, COLOR_GOLD, COLOR_GREEN, COLOR_PURPLE, COLOR_ORANGE];
        ctx.fillStyle = cList[idx % 5]; ctx.beginPath(); ctx.arc(14, 15, 9, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.fillRect(12, 6, 4, 4);
    }
    ctx.restore();
}

function drawPixelPet(ctx, x, y, name, stage=1) {
    ctx.save();
    const size = 24 + (stage - 1) * 8;
    ctx.translate(x - size/2, y - size/2);
    const idx = PETS_DB.findIndex(p => p.name === name);
    const cList = ["rgb(225, 155, 60)", "rgb(240, 240, 245)", "rgb(250, 180, 180)", COLOR_GREEN, "rgb(155, 89, 182)", "rgb(52, 152, 219)", "rgb(241, 196, 15)", "rgb(127, 140, 141)", "rgb(230, 126, 34)"];
    
    // 基礎體態
    ctx.fillStyle = cList[idx % 9];
    ctx.beginPath(); ctx.ellipse(size/2, size/2, size/2 - 2, size/2 - 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = COLOR_WHITE;
    ctx.beginPath(); ctx.arc(size/3, size/3, 2 + stage, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*2/3, size/3, 2 + stage, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgb(20, 20, 20)";
    ctx.beginPath(); ctx.arc(size/3, size/3, 1 + Math.floor(stage/2), 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*2/3, size/3, 1 + Math.floor(stage/2), 0, Math.PI*2); ctx.fill();

    // 3 階段成長配件
    if (stage === 1) {
        ctx.fillStyle = "rgb(255, 200, 200)";
        ctx.beginPath(); ctx.arc(size/4, size/2, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(size*3/4, size/2, 2, 0, Math.PI*2); ctx.fill();
    } else if (stage === 2) {
        ctx.fillStyle = COLOR_GOLD;
        ctx.beginPath(); ctx.moveTo(size/2 - 4, 2); ctx.lineTo(size/2, -3); ctx.lineTo(size/2 + 4, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "rgb(60, 60, 70)"; ctx.fillRect(4, size/2, size - 8, 4);
    } else if (stage === 3) {
        ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(size/2, size/2, size/2 + 2, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = COLOR_GOLD;
        ctx.beginPath(); ctx.moveTo(size/2 - 6, 2); ctx.lineTo(size/2, -5); ctx.lineTo(size/2 + 6, 2); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COLOR_BLUE;
        ctx.beginPath(); ctx.moveTo(0, size/3); ctx.lineTo(-4, size/4); ctx.lineTo(4, size/2); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(size, size/3); ctx.lineTo(size+4, size/4); ctx.lineTo(size-4, size/2); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
}

function drawPixelWeapon(ctx, x, y, wName) {
    ctx.save();
    ctx.translate(x, y);
    const idx = WEAPONS_DB.findIndex(w => w.name === wName);
    const wType = (idx !== -1) ? WEAPONS_DB[idx].type : "sword";

    if (wType === "sword") {
        ctx.strokeStyle = COLOR_WHITE; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(6, 26); ctx.lineTo(26, 6); ctx.stroke();
        ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(4, 28); ctx.lineTo(10, 22); ctx.stroke();
    } else if (wType === "light") {
        ctx.strokeStyle = COLOR_RED; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(6, 26); ctx.lineTo(26, 6); ctx.stroke();
        ctx.strokeStyle = COLOR_WHITE; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, 24); ctx.lineTo(24, 8); ctx.stroke();
    } else if (wType === "staff") {
        ctx.strokeStyle = "rgb(139, 69, 19)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(6, 26); ctx.lineTo(20, 12); ctx.stroke();
        ctx.fillStyle = COLOR_GOLD; ctx.beginPath(); ctx.arc(24, 8, 6, 0, Math.PI*2); ctx.fill();
    } else if (wType === "bow") {
        ctx.strokeStyle = COLOR_GREEN; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(14, 14, 12, 0.5, 2.5); ctx.stroke();
        ctx.strokeStyle = COLOR_WHITE; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(8, 6); ctx.lineTo(22, 24); ctx.stroke();
    } else if (wType === "gun") {
        ctx.fillStyle = "rgb(50, 50, 60)"; ctx.roundRect(6, 12, 20, 8, 2); ctx.fill();
        ctx.fillStyle = "rgb(80, 50, 30)"; ctx.fillRect(8, 20, 5, 8);
    } else if (wType === "fish") {
        ctx.fillStyle = "rgb(52, 152, 219)"; ctx.beginPath(); ctx.ellipse(15, 15, 11, 7, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.beginPath(); ctx.moveTo(24, 15); ctx.lineTo(30, 8); ctx.lineTo(30, 22); ctx.closePath(); ctx.fill();
    } else {
        ctx.strokeStyle = COLOR_WHITE; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(6, 26); ctx.lineTo(14, 18); ctx.stroke();
        ctx.strokeStyle = COLOR_GREEN; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(14, 18); ctx.lineTo(26, 6); ctx.stroke();
    }
    ctx.restore();
}

function drawPixelChest(ctx, x, y, isOpened=false) {

// ==========================================
// 4. 遊戲狀態與實體定義
// ==========================================
class Player {
    constructor() {
        this.name = "勇者"; this.job = "戰士";
        this.level = 1; this.exp = 0; this.gold = 500;
        this.hp = 160; this.max_hp = 160;
        this.shield = 60; this.max_shield = 60;
        this.attack = 18; this.speed = 4.5;
        this.weapons = ["破舊短劍"];
        this.equipped_weapon = "破舊短劍";
        this.current_floor = 1;
        this.x = SCREEN_WIDTH / 2; this.y = SCREEN_HEIGHT / 2;
        this.applyJobStats();
    }
    applyJobStats() {
        if (this.job === "戰士") { this.max_hp = 160; this.max_shield = 60; this.attack = 18; this.speed = 4.5; }
        else if (this.job === "法師") { this.max_hp = 90; this.max_shield = 40; this.attack = 28; this.speed = 3.8; }
        else if (this.job === "弓箭手") { this.max_hp = 110; this.max_shield = 50; this.attack = 20; this.speed = 5.2; }
        this.hp = this.max_hp; this.shield = this.max_shield;
    }
    getTotalAttack() {
        const w = WEAPONS_DB.find(item => item.name === this.equipped_weapon) || {atk: 5};
        return this.attack + w.atk;
    }
    addExp(amount) {
        this.exp += amount;
        const needed = this.level * 50;
        if (this.exp >= needed) {
            this.exp -= needed; this.level += 1;
            this.max_hp += 20; this.hp = this.max_hp;
            this.shield = this.max_shield; this.attack += 4;
            return true;
        }
        return false;
    }
}

class Pet {
    constructor(name, x=300, y=300) {
        this.name = name; this.exp = 0; this.stage = 1;
        this.x = x; this.y = y;
        this.target_x = x; this.target_y = y;
        this.speed = 2.0; this.attackCooldown = 0;
        const info = PETS_DB.find(p => p.name === name) || PETS_DB[0];
        this.baseAtk = info.atk; this.reqExp = info.req_exp;
    }
    getCurrentAttack() { return this.baseAtk + (this.stage - 1) * 8; }
    follow(tx, ty) {
        const dist = Math.hypot(tx - this.x, ty - this.y);
        if (dist > 45) {
            const angle = Math.atan2(ty - this.y, tx - this.x);
            this.x += Math.cos(angle) * (this.speed * 1.5);
            this.y += Math.sin(angle) * (this.speed * 1.5);
        }
    }
    updateAI() {
        if (Math.hypot(this.target_x - this.x, this.target_y - this.y) < 10) {
            if (Math.random() < 0.02) {
                this.target_x = Math.random() * (SCREEN_WIDTH - 200) + 100;
                this.target_y = Math.random() * (SCREEN_HEIGHT - 250) + 150;
            }
        } else {
            const angle = Math.atan2(this.target_y - this.y, this.target_x - this.x);
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;
        }
    }
    feed(addedExp) {
        this.exp += addedExp;
        if (this.exp >= this.reqExp && this.stage < 3) {
            this.exp -= this.reqExp;
            this.stage += 1;
            this.reqExp = Math.floor(this.reqExp * 1.5);
            return true;
        }
        return false;
    }
    getStageStr() { return {1: "幼年體(小)", 2: "成長體(中)", 3: "完全體(大)"}[this.stage]; }
}

const joyShoot = { x: SCREEN_WIDTH - 120, y: SCREEN_HEIGHT - 120, radius: 75, stickX: SCREEN_WIDTH - 120, stickY: SCREEN_HEIGHT - 120, dirX: 0, dirY: 0, isAiming: false, touchId: null };

// ==========================================
// 5. 多點觸控與全螢幕 API
// ==========================================
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
}

function requestFullscreen() {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) docEl.requestFullscreen().catch(()=>{});
    else if (docEl.webkitRequestFullscreen) docEl.webkitRequestFullscreen().catch(()=>{});
    if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock("landscape").catch(()=>{});
    }
}

function handleTouch(e) {
    e.preventDefault();
    for (let i = 0; i < e.touches.length; i++) {
        const touch = e.touches[i];
        const pos = getCanvasPos(touch);

        // 左側移動搖桿
        const dMove = Math.hypot(pos.x - joyMove.x, pos.y - joyMove.y);
        if (dMove < joyMove.radius * 1.8 && (joyMove.touchId === null || joyMove.touchId === touch.identifier)) {
            joyMove.touchId = touch.identifier;
            const angle = Math.atan2(pos.y - joyMove.y, pos.x - joyMove.x);
            const dist = Math.min(dMove, joyMove.radius);
            joyMove.stickX = joyMove.x + Math.cos(angle) * dist;
            joyMove.stickY = joyMove.y + Math.sin(angle) * dist;
            joyMove.dirX = Math.cos(angle) * (dist / joyMove.radius);
            joyMove.dirY = Math.sin(angle) * (dist / joyMove.radius);
            continue;
        }

        // 右側拉動式射擊搖桿
        const dShoot = Math.hypot(pos.x - joyShoot.x, pos.y - joyShoot.y);
        if (dShoot < joyShoot.radius * 1.8 && (joyShoot.touchId === null || joyShoot.touchId === touch.identifier)) {
            joyShoot.touchId = touch.identifier;
            joyShoot.isAiming = true;
            const angle = Math.atan2(pos.y - joyShoot.y, pos.x - joyShoot.x);
            const dist = Math.min(dShoot, joyShoot.radius);
            joyShoot.stickX = joyShoot.x + Math.cos(angle) * dist;
            joyShoot.stickY = joyShoot.y + Math.sin(angle) * dist;
            joyShoot.dirX = Math.cos(angle) * (dist / joyShoot.radius);
            joyShoot.dirY = Math.sin(angle) * (dist / joyShoot.radius);
            continue;
        }

        // E 按鈕
        const dE = Math.hypot(pos.x - btnE.x, pos.y - btnE.y);
        if (dE < btnE.radius && btnE.touchId === null) {
            btnE.touchId = touch.identifier;
            btnE.justPressed = true;
            continue;
        }

        // 空白鍵按鈕
        const dSpace = Math.hypot(pos.x - btnSpace.x, pos.y - btnSpace.y);
        if (dSpace < btnSpace.radius && btnSpace.touchId === null) {
            btnSpace.touchId = touch.identifier;
            btnSpace.justPressed = true;
            continue;
        }
    }
}

canvas.addEventListener("touchstart", (e) => {
    handleTouch(e);
    for (let i = 0; i < e.changedTouches.length; i++) {
        handleClickAction(getCanvasPos(e.changedTouches[i]));
    }
}, {passive: false});

canvas.addEventListener("touchmove", handleTouch, {passive: false});

canvas.addEventListener("touchend", (e) => {
    e.preventDefault();
    const currentIds = Array.from(e.touches).map(t => t.identifier);
    if (!currentIds.includes(joyMove.touchId)) {
        joyMove.touchId = null; joyMove.stickX = joyMove.x; joyMove.stickY = joyMove.y;
        joyMove.dirX = 0; joyMove.dirY = 0;
    }
    if (!currentIds.includes(joyShoot.touchId)) {
        joyShoot.touchId = null; joyShoot.stickX = joyShoot.x; joyShoot.stickY = joyShoot.y;
        joyShoot.dirX = 0; joyShoot.dirY = 0; joyShoot.isAiming = false;
    }
    if (!currentIds.includes(btnE.touchId)) btnE.touchId = null;
    if (!currentIds.includes(btnSpace.touchId)) btnSpace.touchId = null;
}, {passive: false});

canvas.addEventListener("mousedown", (e) => {
    const pos = getCanvasPos(e);
    handleClickAction(pos);
});

function handleClickAction(pos) {
    requestFullscreen();

    // 全螢幕按鈕
    if (pos.x >= btnFullscreen.x && pos.x <= btnFullscreen.x + btnFullscreen.w && pos.y >= btnFullscreen.y && pos.y <= btnFullscreen.y + btnFullscreen.h) {
        requestFullscreen();
        return;
    }

    // 全域返回鈕
    if (state !== "LOBBY" && state !== "QUIZ") {
        if (pos.x >= btnBack.x && pos.x <= btnBack.x + btnBack.w && pos.y >= btnBack.y && pos.y <= btnBack.y + btnBack.h) {
            state = "LOBBY";
            return;
        }
    }

    if (state === "LEARN_STAGE") {
        if (pos.x >= 680 && pos.x <= 840 && pos.y >= 15 && pos.y <= 55) {
            initDungeon();
            return;
        }
        stageWords.forEach((w, i) => {
            const col = i % 4, row = Math.floor(i / 4);
            const x = 30 + col * 240, y = 75 + row * 120;
            if (pos.x >= x && pos.x <= x + 220 && pos.y >= y && pos.y <= y + 105) {
                if (favoriteIds.includes(w.id)) {
                    favoriteIds = favoriteIds.filter(id => id !== w.id);
                    infoMsg = `☆ 取消收藏【${w.jp}】`;
                } else {
                    favoriteIds.push(w.id);
                    infoMsg = `★ 已收藏【${w.jp}】！`;
                }
            }
        });
    } else if (state === "QUIZ") {
        quizOptions.forEach((opt, i) => {
            const bx = 250 + (i % 2) * 270, by = 320 + Math.floor(i / 2) * 90;
            if (pos.x >= bx && pos.x <= bx + 250 && pos.y >= by && pos.y <= by + 60) {
                if (opt === currentQuizChest.word.zh) {
                    const g = Math.floor(Math.random() * 50) + 30;
                    player.gold += g;
                    currentQuizChest.opened = true;
                    if (Math.random() < 0.45) {
                        healthPacks.push({x: currentQuizChest.x, y: currentQuizChest.y});
                        infoMsg = `✨ 答對了！獲得 💰 ${g} 金幣與 💖 回血包！`;
                    } else {
                        infoMsg = `✨ 答對了！開啟寶箱獲得 💰 ${g} 金幣！`;
                    }
                } else {
                    infoMsg = `❌ 答錯了！正確答案是『${currentQuizChest.word.zh}』。`;
                }
                state = "DUNGEON";
            }
        });
    } else if (state === "SHOP") {
        FOODS_DB.forEach((f, i) => {
            const bx = 30 + (i % 5) * 190, by = 105 + Math.floor(i / 5) * 45;
            if (pos.x >= bx + 32 && pos.x <= bx + 177 && pos.y >= by && pos.y <= by + 38) {
                if (player.gold >= f.price) {
                    player.gold -= f.price;
                    inventoryFoods[f.name] = (inventoryFoods[f.name] || 0) + 1;
                    infoMsg = `🛒 購買了【${f.name}】(庫存: ${inventoryFoods[f.name]})！`;
                } else infoMsg = `❌ 金幣不足 ${f.price} 金幣！`;
            }
        });
        PETS_DB.forEach((p, i) => {
            const bx = 30 + (i % 5) * 190, by = 345 + Math.floor(i / 5) * 45;
            if (pos.x >= bx + 32 && pos.x <= bx + 177 && pos.y >= by && pos.y <= by + 38) {
                if (player.gold >= p.price) {
                    player.gold -= p.price;
                    pets.push(new Pet(p.name));
                    infoMsg = `🛒 成功購買強力寵物【${p.name}】！`;
                } else infoMsg = `❌ 金幣不足 ${p.price} 金幣！`;
            }
        });
    } else if (state === "BACKPACK") {
        player.weapons.forEach((wName, i) => {
            const bx = 30 + (i % 4) * 230, by = 120 + Math.floor(i / 4) * 60;
            if (pos.x >= bx + 32 && pos.x <= bx + 212 && pos.y >= by && pos.y <= by + 45) {
                player.equipped_weapon = wName;
                infoMsg = `⚔️ 已裝備【${wName}】！`;
            }
        });
    }
}

// ==========================================
// 6. 核心遊戲流程
// ==========================================
function prepareStage() {
    const unlearned = ALL_VOCABULARY.filter(w => !learnedIds.includes(w.id));
    if (unlearned.length < 20) stageWords = [...ALL_VOCABULARY].sort(() => 0.5 - Math.random()).slice(0, 20);
    else stageWords = [...unlearned].sort(() => 0.5 - Math.random()).slice(0, 20);
    stageWords.forEach(w => { if (!learnedIds.includes(w.id)) learnedIds.push(w.id); });
    state = "LEARN_STAGE";
}

function initDungeon() {
    stageChests = [];
    const shuffled = [...stageWords].sort(() => 0.5 - Math.random());
    let idx = 0;
    for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 5; c++) {
            if (idx < 20) {
                stageChests.push({
                    x: Math.floor(80 + c * ((WORLD_WIDTH - 160) / 4) + (Math.random() * 40 - 20)),
                    y: Math.floor(80 + r * ((WORLD_HEIGHT - 160) / 3) + (Math.random() * 40 - 20)),
                    word: shuffled[idx], opened: false
                });
                idx++;
            }
        }
    }
    currentWave = 1;
    spawnWave(currentWave);
    currentBoss = null;
    bossSpawned = false;
    bossDefeated = false;
    player.x = WORLD_WIDTH / 2; player.y = WORLD_HEIGHT / 2;
    const pet = pets[activePetIdx];
    if (pet) { pet.x = player.x + 30; pet.y = player.y + 30; }
    bullets = []; groundWeapons = []; healthPacks = [];
    countdownTimer = 180;
    state = "DUNGEON";
}

function spawnWave(wNum) {
    stageMonsters = [];
    const count = 6 + player.current_floor * 2;
    for (let i = 0; i < count; i++) {
        const mIdx = Math.min(player.current_floor - 1 + Math.floor(Math.random() * 3), 19);
        const mInfo = MONSTER_TYPES[mIdx];
        const floorMult = 1.0 + (player.current_floor - 1) * 0.2;
        stageMonsters.push({
            x: Math.floor(Math.random() * (WORLD_WIDTH - 160) + 80),
            y: Math.floor(Math.random() * (WORLD_HEIGHT - 160) + 80),
            typeIdx: mIdx,
            name: mInfo.name,
            hp: Math.floor(mInfo.hp * floorMult),
            max_hp: Math.floor(mInfo.hp * floorMult),
            attack: Math.floor(mInfo.atk * floorMult),
            speed: mInfo.speed
        });
    }
    infoMsg = `⚔️ 第 ${wNum} / ${maxWaves} 波怪物來襲！`;
}

// ==========================================
// 7. 主邏輯循環
// ==========================================
function update() {
    // 玩家位移
    player.x += joyMove.dirX * player.speed;
    player.y += joyMove.dirY * player.speed;
    const boundW = (state === "DUNGEON") ? WORLD_WIDTH : SCREEN_WIDTH;
    const boundH = (state === "DUNGEON") ? WORLD_HEIGHT : SCREEN_HEIGHT;
    player.x = Math.max(25, Math.min(boundW - 25, player.x));
    player.y = Math.max(25, Math.min(boundH - 25, player.y));

    const pet = pets[activePetIdx];

    if (state === "LOBBY") {
        if (pet) pet.follow(player.x, player.y);

        if (btnSpace.justPressed) {
            btnSpace.justPressed = false;
            const jobs = ["戰士", "法師", "弓箭手"];
            player.job = jobs[(jobs.indexOf(player.job) + 1) % 3];
            player.applyJobStats();
            infoMsg = `職業切換為【${player.job}】！`;
        }

        if (btnE.justPressed) {
            btnE.justPressed = false;
            if (Math.hypot(player.x - (rectDoor.x + 50), player.y - (rectDoor.y + 40)) < 75) prepareStage();
            else if (Math.hypot(player.x - (rectShop.x + 60), player.y - (rectShop.y + 45)) < 80) state = "SHOP";
            else if (Math.hypot(player.x - (rectPetHouse.x + 60), player.y - (rectPetHouse.y + 50)) < 80) state = "PET_HOUSE";
            else if (Math.hypot(player.x - (rectVocab.x + 50), player.y - (rectVocab.y + 50)) < 75) state = "VOCAB_BANK";
            else if (Math.hypot(player.x - (rectChest.x + 50), player.y - (rectChest.y + 50)) < 75) state = "BACKPACK";
        }
    } else if (state === "PET_HOUSE") {
        pets.forEach((p, idx) => {
            p.updateAI();
            if (Math.hypot(player.x - p.x, player.y - p.y) < 55) {
                if (btnSpace.justPressed) {
                    btnSpace.justPressed = false;
                    activePetIdx = idx;
                    infoMsg = `🐾 【${p.name}】已設為出戰寵物！`;
                } else if (btnE.justPressed) {
                    btnE.justPressed = false;
                    const avail = Object.keys(inventoryFoods).find(k => inventoryFoods[k] > 0);
                    if (avail) {
                        inventoryFoods[avail]--;
                        const fInfo = FOODS_DB.find(f => f.name === avail);
                        if (p.feed(fInfo.exp)) infoMsg = `🎉 寵物【${p.name}】成功進化為【${p.getStageStr()}】！`;
                        else infoMsg = `🍖 餵食了【${avail}】(+${fInfo.exp} EXP，當前: ${p.exp}/${p.reqExp})！`;
                    } else infoMsg = "❌ 庫存沒有食物，請去商店購買！";
                }
            }
        });
    } else if (state === "DUNGEON") {
        if (countdownTimer > 0) { countdownTimer--; return; }

        if (pet) {
            pet.follow(player.x, player.y);
            pet.attackCooldown++;
            if (pet.attackCooldown >= 45) {
                let tgt = null, minD = 350;
                const allT = [...stageMonsters, ...(currentBoss ? [currentBoss] : [])];
                allT.forEach(e => {
                    const d = Math.hypot(e.x - pet.x, e.y - pet.y);
                    if (d < minD) { minD = d; tgt = e; }
                });
                if (tgt) {
                    pet.attackCooldown = 0;
                    const angle = Math.atan2(tgt.y - pet.y, tgt.x - pet.x);
                    bullets.push({
                        x: pet.x, y: pet.y,
                        vx: Math.cos(angle) * 10, vy: Math.sin(angle) * 10,
                        damage: pet.getCurrentAttack(), color: COLOR_PURPLE
                    });
                }
            }
        }

        // 拉動式右側射擊搖桿（持續發射機制）
        if (joyShoot.isAiming) {
            shootCooldownTimer++;
            if (shootCooldownTimer >= 10) { // 每 10 幀（約 0.16 秒）發射一發
                shootCooldownTimer = 0;
                bullets.push({
                    x: player.x, y: player.y,
                    vx: joyShoot.dirX * 12, vy: joyShoot.dirY * 12,
                    damage: player.getTotalAttack(), color: COLOR_GOLD
                });
            }
        } else {
            shootCooldownTimer = 10;
        }

        // 子彈碰撞
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.x += b.vx; b.y += b.vy;
            if (b.x < 0 || b.x > WORLD_WIDTH || b.y < 0 || b.y > WORLD_HEIGHT) { bullets.splice(i, 1); continue; }

            if (currentBoss && Math.hypot(b.x - currentBoss.x, b.y - currentBoss.y) < 40) {
                currentBoss.hp -= b.damage;
                bullets.splice(i, 1);
                if (currentBoss.hp <= 0) {
                    currentBoss = null; bossDefeated = true;
                    player.gold += 300; player.addExp(150);
                    infoMsg = "🏆 成功擊敗本層 BOSS！";
                }
                continue;
            }

            for (let j = stageMonsters.length - 1; j >= 0; j--) {
                const m = stageMonsters[j];
                if (Math.hypot(b.x - m.x, b.y - m.y) < 25) {
                    m.hp -= b.damage;
                    bullets.splice(i, 1);
                    if (m.hp <= 0) {
                        stageMonsters.splice(j, 1);
                        player.gold += Math.floor(Math.random() * 20) + 20;
                        player.addExp(25);
                        if (Math.random() < 0.25) {
                            const weights = WEAPONS_DB.map(w => w.weight);
                            const totalW = weights.reduce((a, b) => a + b, 0);
                            let rand = Math.random() * totalW;
                            let chosen = WEAPONS_DB[0].name;
                            for (let k = 0; k < WEAPONS_DB.length; k++) {
                                if (rand < weights[k]) { chosen = WEAPONS_DB[k].name; break; }
                                rand -= weights[k];
                            }
                            groundWeapons.push({x: m.x, y: m.y, name: chosen});
                        }
                    }
                    break;
                }
            }
        }

        // 拾取武器與回血包
        for (let i = groundWeapons.length - 1; i >= 0; i--) {
            if (Math.hypot(player.x - groundWeapons[i].x, player.y - groundWeapons[i].y) < 30) {
                if (!player.weapons.includes(groundWeapons[i].name)) {
                    player.weapons.push(groundWeapons[i].name);
                    infoMsg = `🎉 拾獲新神兵【${groundWeapons[i].name}】！已存入背包。`;
                }
                groundWeapons.splice(i, 1);
            }
        }
        for (let i = healthPacks.length - 1; i >= 0; i--) {
            if (Math.hypot(player.x - healthPacks[i].x, player.y - healthPacks[i].y) < 30) {
                const heal = Math.floor(player.max_hp * 0.2);
                player.hp = Math.min(player.max_hp, player.hp + heal);
                infoMsg = `💖 拾取回血包！立即恢復 20% 生命值 (+${heal} HP)！`;
                healthPacks.splice(i, 1);
            }
        }

        // 怪物推進
        stageMonsters.forEach(m => {
            const angle = Math.atan2(player.y - m.y, player.x - m.x);
            m.x += Math.cos(angle) * m.speed; m.y += Math.sin(angle) * m.speed;
            if (Math.hypot(player.x - m.x, player.y - m.y) < 28) {
                if (player.shield > 0) player.shield -= 0.4; else player.hp -= 0.3;
            }
        });

        if (currentBoss) {
            const angle = Math.atan2(player.y - currentBoss.y, player.x - currentBoss.x);
            currentBoss.x += Math.cos(angle) * currentBoss.speed; currentBoss.y += Math.sin(angle) * currentBoss.speed;
            if (Math.hypot(player.x - currentBoss.x, player.y - currentBoss.y) < 45) {
                if (player.shield > 0) player.shield -= 0.6; else player.hp -= 0.5;
            }
        }

        if (stageMonsters.length === 0) {
            if (currentWave < maxWaves) {
                currentWave++; spawnWave(currentWave);
            } else if (!bossSpawned && !bossDefeated) {
                const bIdx = Math.min(player.current_floor * 2 - 1, 19);
                const bInfo = MONSTER_TYPES[bIdx];
                const floorMult = 1.0 + (player.current_floor - 1) * 0.2;
                currentBoss = {
                    x: WORLD_WIDTH / 2, y: WORLD_HEIGHT / 2, typeIdx: bIdx,
                    name: `👑 ${bInfo.name} BOSS`,
                    hp: Math.floor(bInfo.hp * 4 * floorMult), max_hp: Math.floor(bInfo.hp * 4 * floorMult),
                    speed: bInfo.speed
                };
                bossSpawned = true;
                infoMsg = `⚠️ 警告！【${currentBoss.name}】降臨了！`;
            }
        }

        stageChests.forEach(c => {
            if (!c.opened && Math.hypot(player.x - c.x, player.y - c.y) < 35) {
                currentQuizChest = c;
                const correct = c.word.zh;
                const wrongs = ALL_VOCABULARY.map(w => w.zh).filter(zh => zh !== correct);
                quizOptions = [...wrongs.sort(() => 0.5 - Math.random()).slice(0, 3), correct].sort(() => 0.5 - Math.random());
                state = "QUIZ";
            }
        });

        if (player.hp <= 0) {
            player.hp = player.max_hp; player.shield = player.max_shield;
            infoMsg = "💀 你在迷宮中戰敗！";
            state = "LOBBY";
        }

        if (stageMonsters.length === 0 && bossDefeated && stageChests.every(c => c.opened)) {
            player.current_floor++;
            infoMsg = `🎉 成功擊潰全 3 波敵人與 BOSS！晉級至第 ${player.current_floor} 層！`;
            state = "LOBBY";
        }
    }
}

// ==========================================
// 8. 完整繪圖渲染
// ==========================================
function draw() {
    ctx.clearRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);

    let camX = 0, camY = 0;
    if (state === "DUNGEON") {
        camX = Math.max(0, Math.min(player.x - SCREEN_WIDTH / 2, WORLD_WIDTH - SCREEN_WIDTH));
        camY = Math.max(0, Math.min(player.y - SCREEN_HEIGHT / 2, WORLD_HEIGHT - SCREEN_HEIGHT));
    }

    if (state === "LOBBY") {
        ctx.fillStyle = "rgb(45, 32, 28)"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.strokeStyle = "rgb(35, 22, 18)"; ctx.lineWidth = 2;
        for (let x = 0; x < SCREEN_WIDTH; x += 64) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, SCREEN_HEIGHT); ctx.stroke(); }
        ctx.fillStyle = "rgb(150, 40, 40)"; ctx.roundRect(220, 180, 584, 360, 12); ctx.fill();

        [rectDoor, rectShop, rectPetHouse, rectVocab, rectChest].forEach(b => {
            drawPixelLobbyBuilding(ctx, b.type, b);
            ctx.fillStyle = "rgb(20, 20, 25)"; ctx.roundRect(b.x + b.w/2 - 50, b.y + b.h + 4, 100, 22, 4); ctx.fill();
            ctx.strokeStyle = b.color; ctx.lineWidth = 1; ctx.stroke();
            ctx.fillStyle = b.color; ctx.font = "bold 12px sans-serif";
            ctx.fillText(b.label, b.x + b.w/2 - 45, b.y + b.h + 19);
        });

        drawPixelHero(ctx, player.x, player.y, player.job);
        const pet = pets[activePetIdx];
        if (pet) drawPixelPet(ctx, pet.x, pet.y, pet.name, pet.stage);

        // 頂部資訊列
        ctx.fillStyle = COLOR_WHITE; ctx.font = "18px sans-serif";
        const petStr = pet ? `出戰: ${pet.name}(Lv.${pet.stage})` : "無出戰寵物";
        ctx.fillText(`【${player.name}】Lv.${player.level} ${player.job} | ${petStr} | 💰 ${player.gold}`, 400, 32);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "18px sans-serif";
        ctx.fillText(infoMsg, 50, SCREEN_HEIGHT - 35);

    } else if (state === "DUNGEON") {
        for (let x = 0; x < SCREEN_WIDTH + 64; x += 64) {
            for (let y = 0; y < SCREEN_HEIGHT + 64; y += 64) {
                const gx = Math.floor((x + camX) / 64), gy = Math.floor((y + camY) / 64);
                ctx.fillStyle = (gx + gy) % 2 === 0 ? COLOR_DUNGEON_1 : COLOR_DUNGEON_2;
                ctx.fillRect(x - (camX % 64), y - (camY % 64), 64, 64);
            }
        }

        stageChests.forEach(c => drawPixelChest(ctx, c.x - camX, c.y - camY, c.opened));
        groundWeapons.forEach(gw => {
            ctx.strokeStyle = COLOR_GOLD; ctx.beginPath(); ctx.arc(gw.x - camX + 14, gw.y - camY + 14, 18, 0, Math.PI*2); ctx.stroke();
            drawPixelWeapon(ctx, gw.x - camX, gw.y - camY, gw.name);
        });
        healthPacks.forEach(hp => {
            ctx.strokeStyle = COLOR_GREEN; ctx.beginPath(); ctx.arc(hp.x - camX + 12, hp.y - camY + 12, 16, 0, Math.PI*2); ctx.stroke();
            drawPixelHealthPack(ctx, hp.x - camX, hp.y - camY);
        });

        stageMonsters.forEach(m => {
            drawPixelMonster(ctx, m.x - camX, m.y - camY, m.typeIdx, false);
            ctx.fillStyle = "rgb(40, 0, 0)"; ctx.fillRect(m.x - camX - 18, m.y - camY - 26, 36, 5);
            ctx.fillStyle = COLOR_GREEN; ctx.fillRect(m.x - camX - 18, m.y - camY - 26, (m.hp / m.max_hp) * 36, 5);
        });

        if (currentBoss) {
            drawPixelMonster(ctx, currentBoss.x - camX, currentBoss.y - camY, currentBoss.typeIdx, true);
        }

        bullets.forEach(b => {
            ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x - camX, b.y - camY, 5, 0, Math.PI*2); ctx.fill();
        });

        drawPixelHero(ctx, player.x - camX, player.y - camY, player.job);
        const pet = pets[activePetIdx];
        if (pet) drawPixelPet(ctx, pet.x - camX, pet.y - camY, pet.name, pet.stage);

        // 頂部 HUD
        ctx.fillStyle = "rgb(15, 18, 24)"; ctx.fillRect(0, 0, SCREEN_WIDTH, 50);
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif";
        const waveStr = !bossSpawned ? `第 ${currentWave}/${maxWaves} 波` : "BOSS 決戰";
        ctx.fillText(`HP: ${Math.floor(player.hp)}/${player.max_hp} | 護盾: ${Math.floor(player.shield)} | 【${waveStr}】 | 💰 ${player.gold}`, 20, 32);

        if (currentBoss) {
            ctx.fillStyle = "rgb(40, 0, 0)"; ctx.roundRect(250, 60, 524, 20, 4); ctx.fill();
            ctx.fillStyle = COLOR_RED; ctx.roundRect(250, 60, 524 * (currentBoss.hp / currentBoss.max_hp), 20, 4); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "14px sans-serif";
            ctx.fillText(`${currentBoss.name} HP: ${Math.floor(currentBoss.hp)}/${currentBoss.max_hp}`, 420, 75);
        }

        if (countdownTimer > 0) {
            ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 72px sans-serif";
            ctx.fillText(Math.ceil(countdownTimer / 60), SCREEN_WIDTH / 2 - 20, SCREEN_HEIGHT / 2);
        }

        // 放棄返回
        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 25, btnBack.y + 26);

    } else if (state === "LEARN_STAGE") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 26px sans-serif";
        ctx.fillText(`📖 第 ${player.current_floor} 層 - 單字預習 (點擊卡片收藏 ★)`, 30, 45);

        ctx.fillStyle = COLOR_GREEN; ctx.roundRect(680, 15, 160, 40, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText("🚀 出發", 730, 42);

        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 25, btnBack.y + 26);

        stageWords.forEach((w, i) => {
            const col = i % 4, row = Math.floor(i / 4);
            const x = 30 + col * 240, y = 75 + row * 120;
            const isFav = favoriteIds.includes(w.id);
            ctx.fillStyle = isFav ? "rgb(75, 65, 30)" : "rgb(50, 60, 80)";
            ctx.roundRect(x, y, 220, 105, 6); ctx.fill();
            ctx.strokeStyle = isFav ? COLOR_GOLD : COLOR_GRAY; ctx.stroke();
            ctx.fillStyle = isFav ? COLOR_GOLD : COLOR_WHITE; ctx.font = "bold 18px sans-serif";
            ctx.fillText(`${isFav ? "★" : "☆"} ${w.jp}`, x + 10, y + 28);
            ctx.fillStyle = COLOR_GRAY; ctx.font = "14px sans-serif"; ctx.fillText(`(${w.romaji})`, x + 10, y + 55);
            ctx.fillStyle = COLOR_GREEN; ctx.font = "bold 18px sans-serif"; ctx.fillText(w.zh, x + 10, y + 85);
        });

    } else if (state === "QUIZ") {
        ctx.fillStyle = "rgba(10, 15, 20, 0.85)"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_PANEL; ctx.roundRect(200, 140, 624, 440, 12); ctx.fill();
        ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 26px sans-serif";
        ctx.fillText("📦 寶箱解鎖問答", 420, 190);
        ctx.fillStyle = COLOR_WHITE; ctx.font = "22px sans-serif";
        ctx.fillText(`請問『 ${currentQuizChest.word.jp} 』(${currentQuizChest.word.romaji}) 的意思？`, 260, 260);

        quizOptions.forEach((opt, i) => {
            const bx = 250 + (i % 2) * 270, by = 320 + Math.floor(i / 2) * 90;
            ctx.fillStyle = COLOR_BLUE; ctx.roundRect(bx, by, 250, 60, 6); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 20px sans-serif";
            ctx.fillText(`${i + 1}. ${opt}`, bx + 30, by + 38);
        });

    } else if (state === "PET_HOUSE") {
        ctx.fillStyle = "rgb(60, 45, 65)"; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText("🐾 寵物小屋 - 靠近按 [E] 餵食 / 按 [SPACE] 設為出戰", 30, 45);

        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 25, btnBack.y + 26);

        pets.forEach((p, i) => {
            drawPixelPet(ctx, p.x, p.y, p.name, p.stage);
            const isAct = (i === activePetIdx);
            ctx.fillStyle = isAct ? COLOR_GOLD : COLOR_WHITE; ctx.font = "14px sans-serif";
            ctx.fillText(`${p.name} (${p.getStageStr().slice(0,3)}) ${isAct ? '★出戰中' : ''}`, p.x - 30, p.y - 25);
        });

        drawPixelHero(ctx, player.x, player.y, player.job);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "18px sans-serif";
        ctx.fillText(infoMsg, 30, SCREEN_HEIGHT - 35);

    } else if (state === "SHOP") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText(`🛒 補給商店 (💰 金幣: ${player.gold})`, 30, 45);

        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 25, btnBack.y + 26);

        ctx.fillStyle = COLOR_WHITE; ctx.font = "18px sans-serif";
        ctx.fillText("🍎 購買食物 (賦予寵物經驗值):", 30, 90);
        FOODS_DB.forEach((f, i) => {
            const bx = 30 + (i % 5) * 190, by = 105 + Math.floor(i / 5) * 45;
            drawPixelFood(ctx, bx, by + 6, f.name);
            ctx.fillStyle = COLOR_GREEN; ctx.roundRect(bx + 32, by, 145, 38, 6); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "14px sans-serif";
            ctx.fillText(`${f.name} 💰${f.price}`, bx + 42, by + 24);
        });

        ctx.fillStyle = COLOR_WHITE; ctx.font = "18px sans-serif";
        ctx.fillText("🐾 購買寵物 (越貴攻擊力越強):", 30, 330);
        PETS_DB.forEach((p, i) => {
            const bx = 30 + (i % 5) * 190, by = 345 + Math.floor(i / 5) * 45;
            drawPixelPet(ctx, bx + 16, by + 20, p.name, 1);
            ctx.fillStyle = COLOR_PURPLE; ctx.roundRect(bx + 32, by, 145, 38, 6); ctx.fill();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "14px sans-serif";
            ctx.fillText(`${p.name} 💰${p.price}`, bx + 42, by + 24);
        });

        ctx.fillStyle = COLOR_GOLD; ctx.font = "18px sans-serif";
        ctx.fillText(infoMsg, 30, 595);

    } else if (state === "BACKPACK") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText("🧰 裝備軍火背包 - 選擇出戰武器", 30, 45);

        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 25, btnBack.y + 26);

        ctx.fillStyle = COLOR_WHITE; ctx.font = "18px sans-serif";
        ctx.fillText(`目前裝備: 【${player.equipped_weapon}】 (總攻擊力: ${player.getTotalAttack()})`, 30, 90);

        player.weapons.forEach((wName, i) => {
            const bx = 30 + (i % 4) * 230, by = 120 + Math.floor(i / 4) * 60;
            drawPixelWeapon(ctx, bx, by + 10, wName);
            const isEq = (wName === player.equipped_weapon);
            const wInfo = WEAPONS_DB.find(w => w.name === wName) || {atk: 5};
            ctx.fillStyle = isEq ? COLOR_GOLD : COLOR_BLUE; ctx.roundRect(bx + 32, by, 180, 45, 6); ctx.fill();
            ctx.fillStyle = isEq ? COLOR_BG_DARK : COLOR_WHITE; ctx.font = "bold 16px sans-serif";
            ctx.fillText(`${wName} (+${wInfo.atk})`, bx + 45, by + 28);
        });

    } else if (state === "VOCAB_BANK") {
        ctx.fillStyle = COLOR_PANEL; ctx.fillRect(0, 0, SCREEN_WIDTH, SCREEN_HEIGHT);
        ctx.fillStyle = COLOR_GOLD; ctx.font = "bold 24px sans-serif";
        ctx.fillText("⭐ 單字收藏庫", 30, 45);

        ctx.fillStyle = COLOR_RED; ctx.roundRect(btnBack.x, btnBack.y, btnBack.w, btnBack.h, 6); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnBack.text, btnBack.x + 25, btnBack.y + 26);

        const favs = ALL_VOCABULARY.filter(w => favoriteIds.includes(w.id));
        if (favs.length === 0) {
            ctx.fillStyle = COLOR_WHITE; ctx.font = "18px sans-serif";
            ctx.fillText("尚無收藏單字！在預習介面點擊單字卡即可收藏。", 50, 120);
        } else {
            favs.slice(0, 14).forEach((w, i) => {
                ctx.fillStyle = COLOR_GOLD; ctx.font = "18px sans-serif";
                ctx.fillText(`★ [${w.jp}] (${w.romaji}) = ${w.zh}`, 50, 95 + i * 36);
            });
        }
    }

    // 全螢幕按鈕
    ctx.fillStyle = "rgba(40, 50, 70, 0.7)"; ctx.roundRect(btnFullscreen.x, btnFullscreen.y, btnFullscreen.w, btnFullscreen.h, 6); ctx.fill();
    ctx.strokeStyle = COLOR_GOLD; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 14px sans-serif"; ctx.fillText(btnFullscreen.text, btnFullscreen.x + 20, btnFullscreen.y + 23);

    // 繪製虛擬按鈕與輪盤
    if (["LOBBY", "DUNGEON", "PET_HOUSE"].includes(state)) {
        // 左側移動搖桿
        ctx.strokeStyle = "rgba(255, 255, 255, 0.35)"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(joyMove.x, joyMove.y, joyMove.radius, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = "rgba(255, 255, 255, 0.65)";
        ctx.beginPath(); ctx.arc(joyMove.stickX, joyMove.stickY, 26, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 12px sans-serif"; ctx.fillText("移動", joyMove.x - 12, joyMove.y + 4);

        if (state === "DUNGEON") {
            // 右側拉動式射擊搖桿
            ctx.strokeStyle = "rgba(255, 204, 0, 0.45)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(joyShoot.x, joyShoot.y, joyShoot.radius, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = joyShoot.isAiming ? "rgba(231, 76, 60, 0.8)" : "rgba(255, 204, 0, 0.65)";
            ctx.beginPath(); ctx.arc(joyShoot.stickX, joyShoot.stickY, 26, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = COLOR_BG_DARK; ctx.font = "bold 12px sans-serif"; ctx.fillText("射擊", joyShoot.x - 12, joyShoot.y + 4);
        }

        if (state === "LOBBY" || state === "PET_HOUSE") {
            // E 鍵
            ctx.fillStyle = COLOR_GOLD; ctx.beginPath(); ctx.arc(btnE.x, btnE.y, btnE.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = COLOR_WHITE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = COLOR_BG_DARK; ctx.font = "bold 18px sans-serif"; ctx.fillText(btnE.text, btnE.x - 7, btnE.y + 6);
            ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 12px sans-serif"; ctx.fillText(btnE.label, btnE.x - 12, btnE.y + 24);

            // 空白鍵
            ctx.fillStyle = COLOR_PURPLE; ctx.beginPath(); ctx.arc(btnSpace.x, btnSpace.y, btnSpace.radius, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = COLOR_WHITE; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = COLOR_WHITE; ctx.font = "bold 12px sans-serif"; ctx.fillText(btnSpace.text, btnSpace.x - 18, btnSpace.y + 4);
        }
    }
}

// ==========================================
// 9. 主循環啟動
// ==========================================
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
